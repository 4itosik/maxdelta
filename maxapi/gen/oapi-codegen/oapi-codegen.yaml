# Конфигурация oapi-codegen для генерации Go-структур из контракта.
#
# Источник — openapi.MaxBotApi.yaml, ОДИН документ. Webhook-документ отдельно
# не генерируется: его WebhookUpdate — тот же oneOf из пятнадцати вариантов,
# что и Update api-документа (сверено: тот же набор, отличается лишь порядок
# перечисления), поэтому тело вебхука разбирается типом Update. Генерация из
# второго документа дала бы 79 типов-близнецов в соседнем пакете, которые
# нельзя передать друг другу без конвертации.
package: maxapi
# Путь считается от рабочего каталога (maxapi/), а не от этого файла.
output: gen/oapi-codegen/models.go
# Только модели. Клиент (`client: true`) генератор тоже умеет — это ещё
# 3344 строки и 20 методов, — но задача здесь: сравнить с вариантом
# quicktype, который даёт ровно структуры. При включённом клиенте
# сравнение прячет издержки за чужой функциональностью.
#
# Отказ от клиента НЕ убирает зависимость github.com/oapi-codegen/runtime:
# она нужна самим моделям — runtime.JSONMerge вызывается 174 раза в
# методах From*, которые собирают union из варианта, подставляя
# поле-дискриминатор.
generate:
  models: true
  client: true

